<main class="messages-app">
    <aside class="conversation-list">
      <h1>Messages</h1>

      <button class="conversation active">
        <div class="avatar chloe-avatar">C</div>
        <div class="conversation-info">
          <strong>Chloe</strong>
          <span>Bella is having a great t...</span>
        </div>
        <div class="conversation-meta">
          <time>9:41</time>
          <b>2</b>
        </div>
      </button>

      <button class="conversation">
        <div class="avatar liam-avatar">L</div>
        <div class="conversation-info">
          <strong>Liam</strong>
          <span>See you Friday at 7am.</span>
        </div>
        <time>Yesterday</time>
      </button>

      <button class="conversation">
        <div class="avatar initials">MR</div>
        <div class="conversation-info">
          <strong>Mia</strong>
          <span>I gave Milo his tablet.</span>
        </div>
        <time>Mon</time>

      <button class="conversation">
        <div class="avatar help-avatar">🐶</div>

          <strong>4tails Help</strong>
          <span>Your refund is done.</span>
        </div>

      </button>
    </aside>

    <section class="chat">
      <header class="chat-header">
        <div class="profile">
          <div class="avatar chloe-avatar">C</div>
          <strong>Chloe</strong>
        </div>
        <button class="booking-btn">View booking</button>
      </header>

      <div class="chat-body">
        <div class="message-row outgoing">
          <div>
            <div class="bubble outgoing-bubble">How did Bella sleep?</div>
            <div class="message-time">8:52 am <span class="checks">✓✓</span></div>
          </div>
        </div>

        <div class="message-row incoming">
          <div>
            <div class="bubble incoming-bubble">Very well! We just had a long walk.</div>
            <div class="message-time">9:38 am</div>
          </div>
        </div>

        <div class="message-row incoming">
          <div>
            <img class="dog-photo" src="https://img.magnific.com/foto-gratis/pequeno-perro-lindo-ojos-cerrados_1161-312.jpg" alt="Bella after a walk">
            <div class="message-time">9:40 am</div>
          </div>
        </div>

        <div class="message-row outgoing">
          <div>
            <div class="bubble outgoing-bubble">Thank you!!</div>
            <div class="message-time">9:43 am <span class="checks">✓✓</span></div>
          </div>
        </div>
      </div>

      <footer class="composer">
        <button class="attachment-btn" aria-label="Attach photo">▣</button>
        <input type="text" placeholder="Write a message" aria-label="Write a message">
        <button class="send-btn" aria-label="Send message">➤</button>
      </footer>
    </section>
  </main>
