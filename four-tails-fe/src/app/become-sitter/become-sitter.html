<div class="safety-checks">

  <!-- Progress: 5 steps -->
  <section class="progress-section">
    <div class="progress">

      <div class="progress-step completed">
        <span>✓</span>
      </div>
      <div class="progress-line"></div>

      <div class="progress-step completed">
        <span>✓</span>
      </div>
      <div class="progress-line"></div>

      <div class="progress-step completed">
        <span>✓</span>
      </div>
      <div class="progress-line"></div>

      <div class="progress-step active">
        <span>4</span>
      </div>
      <div class="progress-line inactive"></div>

      <div class="progress-step pending">
        <span>5</span>
      </div>

    </div>

    <p class="step-label">Step 4 of 5 · Checks</p>
  </section>

  <!-- Safety checks -->
  <section class="checks-list">

    <article class="check-card">
      <div class="check-icon">🪪</div>
      <h2>Photo ID</h2>
      <span class="status status-done">
        <span class="status-dot"></span>
        Done
      </span>
    </article>

    <article class="check-card">
      <div class="check-icon">👮</div>
      <h2>Police check</h2>
      <span class="status status-checking">
        <span class="status-dot"></span>
        Checking
      </span>
    </article>

    <article class="check-card">
      <div class="check-icon insurance-icon">
        📋
        <span class="shield-mini">♥</span>
      </div>
      <h2>Insurance <span class="optional">(optional)</span></h2>
      <button class="upload-button">Upload</button>
    </article>

    <article class="check-card">
      <div class="check-icon">🛡️</div>
      <h2>Selfie</h2>
      <button class="upload-button">Upload</button>
    </article>

  </section>

  <div class="checks-actions">
    <button class="checks-actions__cancel" type="button">Cancel</button>
    <button class="checks-actions__submit" type="button">Submit checks</button>
  </div>
</div>
